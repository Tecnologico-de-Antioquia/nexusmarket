spring.application.name=nexusmarket

# Server
server.port=${SERVER_PORT:8080}

# PostgreSQL (Supabase) relational persistence
spring.datasource.url=${DB_URL:jdbc:postgresql://db.mmdoapnrjnjqlcintiby.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:nexus-admin!}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# MongoDB (traceability / audit)
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/nexusmarket_audit}

# Security / JWT
jwt.secret=${JWT_SECRET:NexusMarketSuperSecretKeyForJwtSigning1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.cors.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
