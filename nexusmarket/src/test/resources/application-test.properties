spring.datasource.url=jdbc:h2:mem:nexusmarket;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.mongodb.uri=mongodb://localhost:27017/nexusmarket_test?serverSelectionTimeoutMS=1000&connectTimeoutMS=1000
jwt.secret=TestSecretKeyForNexusMarketJwtSigning1234567890
jwt.expiration-ms=3600000
app.cors.frontend-origin=http://localhost:5173
