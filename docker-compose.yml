services:
  mongo-db:
    image: mongo:6.0
    container_name: nexusmarket-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  nexusmarket-app:
    build:
      context: ./nexusmarket
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - ./nexusmarket:/workspace
      - maven_cache:/root/.m2
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      MONGODB_URI: mongodb://mongo-db:27017/nexusmarket_audit
      DB_URL: ${DB_URL:-jdbc:postgresql://db.mmdoapnrjnjqlcintiby.supabase.co:5432/postgres?sslmode=require}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-nexus-admin!}
      JWT_SECRET: ${JWT_SECRET:-NexusMarketSuperSecretKeyForJwtSigning1234567890}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    depends_on:
      mongo-db:
        condition: service_healthy

volumes:
  mongo_data:
  maven_cache:
